[workspace]
resolver = "2"
members = [
    "crates/veridoc-protocol",
    "crates/veridoc-engine",
    "crates/veridoc-cli",
    "crates/veridoc-conformance",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
veridoc-protocol = { path = "crates/veridoc-protocol" }
veridoc-engine = { path = "crates/veridoc-engine" }
veridoc-conformance = { path = "crates/veridoc-conformance" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
thiserror = "2.0.21"
plugin-rpc = "0.1.0-alpha.5"
sha2 = "0.11.1"
# Only the Anthropic judge transport makes HTTP; rustls keeps it off OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3"

[profile.release]
overflow-checks = true
