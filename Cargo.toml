[workspace]
resolver = "2"
members = [
    "crates/veridoc-protocol",
    "crates/veridoc-engine",
    "crates/veridoc-cli",
    "crates/veridoc-conformance",
    "crates/testprovider",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
veridoc-protocol = { path = "crates/veridoc-protocol" }
veridoc-engine = { path = "crates/veridoc-engine" }
veridoc-conformance = { path = "crates/veridoc-conformance" }
veridoc-testprovider = { path = "crates/testprovider" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
thiserror = "2.0.21"
# The suite program writes the verdict file `prpc-core` reads, so this pin is the revision
# `.github/workflows/ci.yml` installs: the two must agree on that shape.
plugin-rpc = "0.1.0-alpha.11"
sha2 = "0.11.1"
# The judge is the only network user. rig-core is the provider-neutral client (OpenAI,
# Anthropic, Gemini, Groq, xAI, Mistral, Ollama, and any OpenAI-compatible server through
# `baseUrl`); tokio is present only to drive rig's async call from the engine's sync loop.
rig-core = { version = "0.46", features = ["reqwest"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3"
# `veridoc init` asks the questions its flags do not answer. Prompts go to stderr, so stdout carries
# only the paths written, which is what a scripted run reads.
dialoguer = { version = "0.12.0", default-features = false }

# `<project>/.env` holds the values a machine supplies, such as the address of a local model server.
# dotenvy parses it and expands `${OTHER}` inside a value, which is dotenv's ordinary behaviour; the
# engine's own `${NAME}` substitution happens later, over the configuration text (`config.rs`).
dotenvy = "0.15.7"

[profile.release]
overflow-checks = true
