[package]
name = "veridoc-conformance"
description = "Conformance suite for veridoc plugins: drive one over the protocol and report, rule by rule, whether it conforms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The suite drives the same Launch/PluginClient transport the engine uses in a check, so a
# validated plugin is driven exactly as production drives it.
veridoc-engine.workspace = true
veridoc-protocol.workspace = true
# Every plugin response is validated as an instance of the committed schema before deserialization.
jsonschema = { version = "0.61.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
