name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate autofuzz runs: any clippy warning in any target, including tests, fails the
  # job, and every test that needs no Node runs here because veridoc-fakeplugin answers
  # the protocol in Rust.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # The install machinery end to end: clone, manifest parse, install and build steps,
  # conformance, registry record. The fixture is a one-file repository generated around
  # the fake plugin this repository ships. Plugin repositories prove themselves against
  # this engine in their own CI; the engine never fetches a plugin to test itself.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the CLI
        run: cargo build --release -p veridoc-cli

      - name: Install the fake plugin through the install machinery
        run: |
          set -eu
          cargo build --release -p veridoc-fakeplugin
          repo=$(mktemp -d)
          mkdir -p "$repo/bin"
          cp target/release/veridoc-fakeplugin "$repo/bin/"
          cat > "$repo/veridoc-plugin.json" <<'EOF'
          {
            "name": "veridoc-fakeplugin",
            "install": [],
            "build": [],
            "command": ["bin/veridoc-fakeplugin"],
            "conformance": { "emitter": ["bin/veridoc-fakeplugin", "--emit-conformance"] }
          }
          EOF
          git -C "$repo" init -q
          git -C "$repo" add -A
          git -C "$repo" -c user.email=ci@veridoc -c user.name=ci commit -qm fixture
          export VERIDOC_HOME="$PWD/.ci/registry"
          target/release/veridoc install-plugin "$repo"
          target/release/veridoc plugins | grep -q '^veridoc-fakeplugin '

  # `curl | sh` runs this file with sh, which is dash on Debian and Ubuntu, so a bashism
  # breaks the installer silently. shellcheck plus a real dash parse is the gate.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the installer
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck dash
          shellcheck -s sh install.sh
          dash -n install.sh
